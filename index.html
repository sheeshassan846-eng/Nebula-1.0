<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebula AI v2.0</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1b1440, #090a14 70%);
      color: #f1f5f9;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 760px;
      height: 90vh;
      background: rgba(17, 20, 38, 0.92);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .header {
      padding: 16px 20px;
      background: rgba(15, 18, 34, 0.95);
      border-bottom: 1px solid rgba(139, 92, 246, 0.25);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.25rem;
      background: linear-gradient(90deg, #a78bfa, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status {
      font-size: 0.8rem;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user-msg {
      align-self: flex-end;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .bot-msg {
      align-self: flex-start;
      background: #1e2440;
      border: 1px solid rgba(148, 163, 184, 0.15);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .source-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.82rem;
      color: #38bdf8;
      text-decoration: none;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .input-area {
      padding: 14px 16px;
      background: rgba(15, 18, 34, 0.95);
      border-top: 1px solid rgba(139, 92, 246, 0.25);
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: #0f1326;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #8b5cf6;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #ffffff;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>Nebula AI v2.0</h1>
      <div class="status">
        <span class="status-dot"></span>
        Web Search + Local Brain
      </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Ask Nebula anything (e.g., what is photosynthesis)..."
        autocomplete="off"
      />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    const defaultIntents = [
      {
        patterns: ["hello", "hi", "hey", "good morning", "good evening", "whats up"],
        responses: [
          "Hello! I am Nebula AI. Ask me anything!",
          "Hey there! Nebula AI v2.0 is online and ready.",
          "Greetings! What would you like to know today?"
        ]
      },
      {
        patterns: ["who are you", "what is your name", "tell me about yourself", "what are you"],
        responses: [
          "I am Nebula AI v2.0. I combine a local memory with live web search to answer your questions.",
          "My name is Nebula AI. I can search the web for answers, solve math, and remember anything you teach me."
        ]
      },
      {
        patterns: ["thank you", "thanks", "appreciate it", "thx"],
        responses: ["You're welcome!", "Happy to help!", "Anytime!"]
      },
      {
        patterns: ["bye", "goodbye", "see you later", "exit"],
        responses: ["Goodbye! I'll be right here whenever you need me.", "See you later!"]
      }
    ];

    function loadMemory() {
      try {
        const saved = localStorage.getItem("nebula_ai_memory");
        return saved ? JSON.parse(saved) : [];
      } catch (e) {
        return [];
      }
    }

    function saveMemory(memory) {
      localStorage.setItem("nebula_ai_memory", JSON.stringify(memory));
    }

    let learnedIntents = loadMemory();

    function cleanText(text) {
      return text.toLowerCase().replace(/[^\w\s]/g, "").trim();
    }

    function similarity(a, b) {
      if (a === b) return 1;
      if (!a.length || !b.length) return 0;

      const matrix = Array.from({ length: b.length + 1 }, (_, i) => [i]);
      for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

      for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
          const cost = b[i - 1] === a[j - 1] ? 0 : 1;
          matrix[i][j] = Math.min(
            matrix[i - 1][j] + 1,
            matrix[i][j - 1] + 1,
            matrix[i - 1][j - 1] + cost
          );
        }
      }

      const distance = matrix[b.length][a.length];
      return 1 - distance / Math.max(a.length, b.length);
    }

    function solveMath(text) {
      const cleanedMath = text.trim();
      if (/^[\d\s+\-*/().]+$/.test(cleanedMath) && /\d/.test(cleanedMath)) {
        try {
          const result = Function('"use strict"; return (' + cleanedMath + ")")();
          if (typeof result === "number" && isFinite(result)) {
            return "The answer is " + result + ".";
          }
        } catch (e) {
          return null;
        }
      }
      return null;
    }

    // Extract the main topic from a natural question
    function extractSearchQuery(rawInput) {
      let query = rawInput.trim().replace(/[?!.]+$/g, "");
      const prefixes = [
        /^what is (a |an |the )?/i,
        /^what are (the )?/i,
        /^who is (the )?/i,
        /^who was (the )?/i,
        /^where is (the )?/i,
        /^when was (the )?/i,
        /^how does /i,
        /^how do /i,
        /^tell me about /i,
        /^explain /i,
        /^define /i,
        /^search (for )?/i
      ];

      for (const prefix of prefixes) {
        if (prefix.test(query)) {
          query = query.replace(prefix, "").trim();
          break;
        }
      }
      return query || rawInput.trim();
    }

    // Free web lookup using Wikipedia's public search + summary (no API key needed)
    async function searchWeb(rawInput) {
      const topic = extractSearchQuery(rawInput);

      try {
        const searchUrl =
          "https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=" +
          encodeURIComponent(topic) +
          "&utf8=&format=json&origin=*";

        const searchRes = await fetch(searchUrl);
        const searchData = await searchRes.json();

        if (!searchData.query || !searchData.query.search.length) {
          return null;
        }

        const bestTitle = searchData.query.search[0].title;
        const summaryUrl =
          "https://en.wikipedia.org/api/rest_v1/page/summary/" +
          encodeURIComponent(bestTitle);

        const summaryRes = await fetch(summaryUrl);
        if (!summaryRes.ok) return null;

        const summaryData = await summaryRes.json();
        if (!summaryData.extract) return null;

        return {
          text: summaryData.extract,
          sourceUrl: summaryData.content_urls?.desktop?.page || null,
          title: summaryData.title
        };
      } catch (e) {
        return null;
      }
    }

    function getLocalResponse(rawInput) {
      const cleaned = cleanText(rawInput);

      // 1. Teaching mode
      if (rawInput.toLowerCase().startsWith("learn:")) {
        const content = rawInput.slice(6).trim();
        const eqIndex = content.indexOf("=");
        if (eqIndex === -1) {
          return "Please use the format: learn: your question = my answer";
        }
        const question = cleanText(content.slice(0, eqIndex));
        const answer = content.slice(eqIndex + 1).trim();

        if (!question || !answer) {
          return "Please use the format: learn: your question = my answer";
        }

        learnedIntents.push({ patterns: [question], responses: [answer] });
        saveMemory(learnedIntents);
        return `Got it! I have permanently learned how to respond to "${question}".`;
      }

      // 2. Built-in commands
      if (cleaned === "help") {
        return (
          "Here is what I can do:\n" +
          "• Answer almost any factual question by searching the web\n" +
          "• Solve math (e.g., 45 * 12 + 8)\n" +
          "• Tell the 'time' or 'date'\n" +
          "• Learn custom answers: learn: your question = my answer\n" +
          "• Type 'clear memory' to reset what you taught me"
        );
      }

      if (cleaned === "clear memory") {
        learnedIntents = [];
        saveMemory(learnedIntents);
        return "My learned memory has been cleared.";
      }

      if (["time", "what time is it", "current time"].includes(cleaned)) {
        return "The current time is " + new Date().toLocaleTimeString() + ".";
      }

      if (["date", "what is the date", "todays date"].includes(cleaned)) {
        return "Today is " + new Date().toLocaleDateString(undefined, {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        }) + ".";
      }

      // 3. Math solver
      const mathResult = solveMath(rawInput);
      if (mathResult) return mathResult;

      // 4. Local memory + default greetings (high match threshold so real questions go to web search)
      const allIntents = [...learnedIntents, ...defaultIntents];
      let bestScore = 0;
      let bestResponses = null;

      for (const intent of allIntents) {
        for (const pattern of intent.patterns) {
          const score = similarity(cleaned, cleanText(pattern));
          if (score > bestScore) {
            bestScore = score;
            bestResponses = intent.responses;
          }
        }
      }

      if (bestScore >= 0.72 && bestResponses) {
        return bestResponses[Math.floor(Math.random() * bestResponses.length)];
      }

      return null;
    }

    function addMessage(text, sender, sourceUrl = null, sourceTitle = null) {
      const msgDiv = document.createElement("div");
      msgDiv.className = "message " + (sender === "user" ? "user-msg" : "bot-msg");
      msgDiv.textContent = text;

      if (sourceUrl) {
        const br = document.createElement("br");
        const link = document.createElement("a");
        link.href = sourceUrl;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "source-link";
        link.textContent = "Source: " + (sourceTitle || "Read more");
        msgDiv.appendChild(br);
        msgDiv.appendChild(link);
      }

      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";

      // Check local brain first
      const localReply = getLocalResponse(text);
      if (localReply) {
        setTimeout(() => addMessage(localReply, "bot"), 150);
        return;
      }

      // Otherwise, search the web
      const loadingMsg = addMessage("Searching the web...", "bot");
      const webResult = await searchWeb(text);
      loadingMsg.remove();

      if (webResult) {
        addMessage(webResult.text, "bot", webResult.sourceUrl, webResult.title);
      } else {
        addMessage(
          "I couldn't find an answer on the web for that. You can teach me by typing:\nlearn: your question = my answer",
          "bot"
        );
      }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSend();
    });

    addMessage("Nebula AI v2.0 is online! Ask me any question or type 'help'.", "bot");
  </script>
</body>
</html>
